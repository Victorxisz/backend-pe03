[pytest]
testpaths = tests
pythonpath = . tests
addopts = -ra --import-mode=importlib
markers =
    routes(*routes): rotas necessárias (método e caminho)
    atlas: integração com MongoDB Atlas de teste, habilitada por --atlas
    cloudinary: integração real de mídia, exige RUN_CLOUDINARY_TESTS=1 e TEST_CLOUDINARY_*
