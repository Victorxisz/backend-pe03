[pytest]
testpaths = tests
pythonpath = . tests
addopts = -ra --import-mode=importlib
markers =
    cloudinary: integração real de mídia, exige RUN_CLOUDINARY_TESTS=1 e TEST_CLOUDINARY_*
    routes(*routes): rotas necessárias (método e caminho)
    atlas: integração com MongoDB usando MONGO_URI e coleções temporárias, habilitada por --atlas
